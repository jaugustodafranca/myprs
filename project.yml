name: MyPRs
options:
  bundleIdPrefix: com.zaintech
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 688YYDN5Z4
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MyPRsKit:
    path: Packages/MyPRsKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  MyPRs:
    type: application
    platform: macOS
    sources: [MyPRs]
    dependencies:
      - package: MyPRsKit
      - package: Sparkle
      - target: MyPRsWidget
    entitlements:
      path: MyPRs/Resources/MyPRs.entitlements
      properties:
        com.apple.security.application-groups: [688YYDN5Z4.com.zaintech.myprs]
    info:
      path: MyPRs/Resources/Info.plist
      properties:
        LSUIElement: true
        SUFeedURL: https://github.com/jaugustodafranca/myprs/releases/latest/download/appcast.xml
        SUPublicEDKey: RKgHI37mknm9PYCdlcikcW57jfIf9xoAQtlCTXjNLvE=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.zaintech.myprs
            CFBundleURLSchemes: [myprs]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zaintech.myprs
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MyPRsWidget:
    type: app-extension
    platform: macOS
    sources: [MyPRsWidget]
    dependencies:
      - package: MyPRsKit
    entitlements:
      path: MyPRsWidget/MyPRsWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [688YYDN5Z4.com.zaintech.myprs]
    info:
      path: MyPRsWidget/Info.plist
      properties:
        CFBundleDisplayName: MyPRs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zaintech.myprs.widget
        ENABLE_HARDENED_RUNTIME: true
  MyPRsTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MyPRsTests]
    dependencies:
      - target: MyPRs
      - package: MyPRsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zaintech.myprs.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MyPRs.app/Contents/MacOS/MyPRs
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
schemes:
  MyPRs:
    build:
      targets:
        MyPRs: all
        MyPRsWidget: all
    test:
      targets:
        - MyPRsTests
        - package: MyPRsKit/MyPRsKitTests
