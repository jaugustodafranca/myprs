name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SPARKLE_VERSION: "2.10.0"
  # SHA-256 of Sparkle-2.10.0.tar.xz from the official GitHub release; bump together with SPARKLE_VERSION.
  SPARKLE_SHA256: "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c"

jobs:
  release:
    runs-on: macos-15
    # Protected environment: owner approval required, v* tags only (see docs/release.md).
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of origin/main; releases are cut from main only."
            exit 1
          fi

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: scripts/install-xcodegen.sh

      - name: Set version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "DMG=MyPRs-${GITHUB_REF_NAME#v}.dmg" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(uuidgen)
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Archive
        run: |
          xcodebuild archive \
            -project MyPRs.xcodeproj \
            -scheme MyPRs \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/MyPRs.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM=688YYDN5Z4

      - name: Export
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MyPRs.xcarchive" \
            -exportOptionsPlist scripts/ExportOptions.plist \
            -exportPath build

      - name: Write App Store Connect API key
        env:
          KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: echo "$KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Notarize and staple app
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_ID="$(printf '%s' "$KEY_ID" | tr -d '[:space:]"')"
          ISSUER_ID="$(printf '%s' "$ISSUER_ID" | tr -d '[:space:]"')"
          ditto -c -k --keepParent build/MyPRs.app "$RUNNER_TEMP/MyPRs.zip"
          xcrun notarytool submit "$RUNNER_TEMP/MyPRs.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" --wait
          xcrun stapler staple build/MyPRs.app

      - name: Verify app signature and Gatekeeper
        run: |
          codesign --verify --deep --strict --verbose=2 build/MyPRs.app
          spctl --assess --type execute --verbose build/MyPRs.app

      - name: Install create-dmg
        run: scripts/install-create-dmg.sh

      - name: Create DMG
        run: |
          scripts/make-dmg.sh build/MyPRs.app "$DMG"
          codesign --sign "Developer ID Application" --timestamp "$DMG"

      - name: Notarize and staple DMG
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_ID="$(printf '%s' "$KEY_ID" | tr -d '[:space:]"')"
          ISSUER_ID="$(printf '%s' "$ISSUER_ID" | tr -d '[:space:]"')"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" --wait
          xcrun stapler staple "$DMG"

      - name: Sign DMG for Sparkle
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir "$RUNNER_TEMP/sparkle"
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_SHA256}  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          attributes=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - "$DMG")
          echo "attributes=$attributes" >> "$GITHUB_OUTPUT"

      - name: Generate appcast
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNATURE_ATTRIBUTES: ${{ steps.sparkle.outputs.attributes }}
        run: scripts/make-appcast.sh "$GITHUB_REF_NAME" "$VERSION" "$DMG" "$SIGNATURE_ATTRIBUTES"

      - name: Sign appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - appcast.xml
          grep -q 'sparkle-signatures:' appcast.xml

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$DMG" appcast.xml --repo "$GITHUB_REPOSITORY" --generate-notes

      - name: Clean up
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
