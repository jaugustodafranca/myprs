  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <g transform="translate(0 -20)"><g filter="url(#glyphShadow)" fill="none" stroke="url(#glyph)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M364 394 V574"/>
    <path d="M660 574 V470 Q660 360 550 360 H470"/>
    <path d="M514 308 L462 360 L514 412"/>
    <circle cx="364" cy="318" r="52" fill="#3F55E6"/>
    <circle cx="364" cy="650" r="52" fill="#3F55E6"/>
    <circle cx="660" cy="650" r="52" fill="#3F55E6"/>
  </g></g>

  <g>
    <circle cx="420" cy="806" r="30" fill="url(#dotGreen)"/>
    <circle cx="512" cy="806" r="30" fill="url(#dotOrange)"/>
    <circle cx="604" cy="806" r="30" fill="url(#dotRed)"/>
