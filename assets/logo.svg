<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="MyPRs">
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="0.55" stop-color="#3A4FE0"/>
      <stop offset="1" stop-color="#241A8C"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE5FF"/>
    </linearGradient>
    <radialGradient id="dotGreen" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#6BF08F"/><stop offset="1" stop-color="#1FB854"/></radialGradient>
    <radialGradient id="dotOrange" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFC15A"/><stop offset="1" stop-color="#F08A12"/></radialGradient>
    <radialGradient id="dotRed" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FF7A70"/><stop offset="1" stop-color="#E0352B"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#0B1040" flood-opacity="0.45"/>
